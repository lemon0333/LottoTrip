name: LottoTrip
options:
  bundleIdPrefix: com.lottotrip
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
packages:
  Moya:
    url: https://github.com/Moya/Moya
    from: "15.0.0"
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: "5.8.0"
  SnapKit:
    url: https://github.com/SnapKit/SnapKit
    from: "5.7.0"
  Then:
    url: https://github.com/devxoul/Then
    from: "3.0.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "7.11.0"
  KakaoOpenSDK:
    url: https://github.com/kakao/kakao-ios-sdk
    from: "2.9.0"
targets:
  LottoTrip:
    type: application
    platform: iOS
    sources:
      - path: LottoTrip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lottotrip.app
        INFOPLIST_FILE: LottoTrip/Resources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Moya
      - package: Alamofire
      - package: SnapKit
      - package: Then
      - package: Kingfisher
      - package: KakaoOpenSDK
        product: KakaoSDKCommon
      - package: KakaoOpenSDK
        product: KakaoSDKAuth
      - package: KakaoOpenSDK
        product: KakaoSDKUser
